name: "AI Code Review"
description: "RAG-ассистированное ревью pull request'ов через LLM (Groq/Gemini/OpenRouter с фолбэком)"
author: "TuychiyevNodirbek"

inputs:
  api-url:
    description: "URL вашего Review API сервиса (см. https://github.com/TuychiyevNodirbek/llm-code-review)"
    required: true
  api-token:
    description: "API-токен вашего сервиса (REVIEW_API_TOKEN)"
    required: true
  github-token:
    description: "Токен для постинга комментариев в PR"
    required: true
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Get PR diff
      shell: bash
      run: |
        git fetch origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
        git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > "${{ github.action_path }}/pr.diff"

    - name: Send to Review API
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_TOKEN: ${{ inputs.api-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        DIFF_PATH: ${{ github.action_path }}/pr.diff
        REQUEST_PATH: ${{ github.action_path }}/request.json
      run: |
        # Собираем JSON-тело в файл, а не в аргумент командной строки —
        # на больших PR (много изменённого кода) diff не помещается в
        # ARG_MAX, и curl падает с "Argument list too long".
        python3 -c "
        import json, os
        with open(os.environ['DIFF_PATH']) as f:
            diff = f.read()
        payload = {
            'repo': os.environ['PR_REPO'],
            'pr_number': int(os.environ['PR_NUMBER']),
            'base_sha': os.environ['BASE_SHA'],
            'head_sha': os.environ['HEAD_SHA'],
            'diff': diff,
            'installation_token': os.environ['GH_TOKEN'],
        }
        with open(os.environ['REQUEST_PATH'], 'w') as f:
            json.dump(payload, f)
        "
        curl -sS -X POST "$API_URL/review" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $API_TOKEN" \
          --data @"$REQUEST_PATH" \
          --fail-with-body

branding:
  icon: "check-circle"
  color: "purple"
